name: Assignment 4 Java verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assignment4_SDP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run behavioral tests
        run: bash run.sh test
      - name: Run Facade demo
        run: bash run.sh demo
      - name: Verify direct subsystem use
        run: bash run.sh direct
